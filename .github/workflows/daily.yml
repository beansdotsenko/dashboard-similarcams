name: Refresh dashboard

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC = 10:00 Moscow каждый день
  workflow_dispatch:       # ручной запуск через кнопку в GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Supermetry
        run: python supermetry_fetch.py
        env:
          SUPERMETRY_URL: ${{ secrets.SUPERMETRY_URL }}
          SUPERMETRY_KEY: ${{ secrets.SUPERMETRY_KEY }}
          SUPERMETRY_SITE_ID: ${{ secrets.SUPERMETRY_SITE_ID }}

      - name: Generate dashboard
        continue-on-error: true   # Finteza не должна ломать обновление Supermetry
        run: python finteza_fetch.py
        env:
          FINTEZA_COOKIE: ${{ secrets.FINTEZA_COOKIE }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ finteza_memory.json
          git diff --staged --quiet || git commit -m "chore: daily refresh $(date -u '+%Y-%m-%d')"
          git push
